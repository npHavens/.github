name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Runs the review workflow's own shell steps against a stubbed gh: no secrets, no network.
jobs:
  workflow-tests:
    name: Review workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 --version && python3 -m unittest discover -s Tests -p 'test_*.py'
